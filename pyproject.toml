[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-boundary-lab"
version = "0.1.0"
description = "A reproducible HCI security prototype for reviewing AI agent tool calls"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
trust-boundary-evaluate = "trust_boundary_lab.evaluate:main"

[tool.setuptools.packages.find]
include = ["trust_boundary_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
