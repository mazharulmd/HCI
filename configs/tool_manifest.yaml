# CLEAR tool capability manifest
# ---------------------------------------------------------------------------
# Every tool an agent can call is annotated ONCE by the tool developer /
# platform (analogous to Android permission protection levels). Annotations
# describe tool *semantics* only; they were written from the tool signatures
# and docstrings before any evaluation was run and are frozen for all
# experiments (see docs/research_design.md, "Frozen configuration").
#
# Fields
#   capability    : capability class used by the intent envelope
#                   (read | web_fetch | communicate | financial | calendar_write |
#                    file_write | delete | account | reservation | workspace_admin)
#   sensitivity   : s(f) in [0,1], harm potential if the call is executed
#                   against the user's intent (0 = read-only, 1 = financial /
#                   credential compromise)
#   reversible    : whether the user can undo the effect without third parties
#   target_args   : arguments that designate *who/where* the effect goes to
#                   (recipients, URLs, object identifiers)
#   content_args  : arguments that carry data out of the user's trust domain
#   value_args    : arguments that set magnitudes (amounts, passwords, dates)
#   output_trust  : provenance label of what the tool returns
#                   trusted   = generated by the user's own system of record
#                   untrusted = may contain third-party-authored text
#   private_output: whether the output contains the user's private data
#                   (relevant to exfiltration analysis)
# ---------------------------------------------------------------------------

defaults:
  capability: read
  sensitivity: 0.0
  reversible: true
  target_args: []
  content_args: []
  value_args: []
  output_trust: untrusted
  private_output: false

tools:
  # ------------------------------------------------------------- banking
  get_iban:                {output_trust: trusted, private_output: true}
  get_balance:             {output_trust: trusted, private_output: true}
  get_user_info:           {output_trust: trusted, private_output: true}
  get_most_recent_transactions: {output_trust: untrusted, private_output: true}
  get_scheduled_transactions:   {output_trust: untrusted, private_output: true}
  read_file:               {output_trust: untrusted, private_output: true}
  send_money:
    capability: financial
    sensitivity: 1.0
    reversible: false
    target_args: [recipient]
    content_args: [subject]
    value_args: [amount, date]
  schedule_transaction:
    capability: financial
    sensitivity: 1.0
    reversible: true
    target_args: [recipient]
    content_args: [subject]
    value_args: [amount, date, recurring]
  update_scheduled_transaction:
    capability: financial
    sensitivity: 1.0
    reversible: true
    target_args: [id, recipient]
    content_args: [subject]
    value_args: [amount, date, recurring]
  update_password:
    capability: account
    sensitivity: 1.0
    reversible: false
    target_args: []
    value_args: [password]
  update_user_info:
    capability: account
    sensitivity: 0.6
    reversible: true
    value_args: [first_name, last_name, street, city]

  # ------------------------------------------------------------- slack
  get_channels:            {output_trust: untrusted}   # channel names are authored by workspace members
  get_users_in_channel:    {output_trust: untrusted}   # user names are self-chosen
  read_channel_messages:   {output_trust: untrusted, private_output: true}
  read_inbox:              {output_trust: untrusted, private_output: true}
  get_webpage:
    capability: web_fetch
    sensitivity: 0.4
    reversible: true         # no persistent state change; leakage via URL is scored by kappa
    target_args: [url]
    output_trust: untrusted
  post_webpage:
    capability: communicate
    sensitivity: 0.9
    reversible: false
    target_args: [url]
    content_args: [content]
  send_direct_message:
    capability: communicate
    sensitivity: 0.8
    reversible: false
    target_args: [recipient]
    content_args: [body]
  send_channel_message:
    capability: communicate
    sensitivity: 0.7
    reversible: false
    target_args: [channel]
    content_args: [body]
  add_user_to_channel:
    capability: workspace_admin
    sensitivity: 0.6
    reversible: true
    target_args: [user, channel]
  invite_user_to_slack:
    capability: workspace_admin
    sensitivity: 0.7
    reversible: true
    target_args: [user, user_email]
  remove_user_from_slack:
    capability: workspace_admin
    sensitivity: 0.7
    reversible: false
    target_args: [user]

  # ------------------------------------------------------------- travel
  get_user_information:    {output_trust: trusted, private_output: true}
  get_all_hotels_in_city:  {output_trust: untrusted}
  get_hotels_prices:       {output_trust: untrusted}
  get_rating_reviews_for_hotels: {output_trust: untrusted}
  get_hotels_address:      {output_trust: untrusted}
  get_all_restaurants_in_city: {output_trust: untrusted}
  get_cuisine_type_for_restaurants: {output_trust: untrusted}
  get_restaurants_address: {output_trust: untrusted}
  get_rating_reviews_for_restaurants: {output_trust: untrusted}
  get_dietary_restrictions_for_all_restaurants: {output_trust: untrusted}
  get_contact_information_for_restaurants: {output_trust: untrusted}
  get_price_for_restaurants: {output_trust: untrusted}
  check_restaurant_opening_hours: {output_trust: untrusted}
  get_all_car_rental_companies_in_city: {output_trust: untrusted}
  get_car_types_available: {output_trust: untrusted}
  get_rating_reviews_for_car_rental: {output_trust: untrusted}
  get_car_fuel_options:    {output_trust: untrusted}
  get_car_rental_address:  {output_trust: untrusted}
  get_car_price_per_day:   {output_trust: untrusted}
  get_flight_information:  {output_trust: untrusted}
  reserve_hotel:
    capability: reservation
    sensitivity: 0.6
    reversible: true
    target_args: [hotel]
    value_args: [start_day, end_day]
  reserve_car_rental:
    capability: reservation
    sensitivity: 0.6
    reversible: true
    target_args: [company]
    value_args: [start_time, end_time]
  reserve_restaurant:
    capability: reservation
    sensitivity: 0.5
    reversible: true
    target_args: [restaurant]
    value_args: [start_time]

  # ------------------------------------------------------------- workspace (email / calendar / drive)
  send_email:
    capability: communicate
    sensitivity: 0.8
    reversible: false
    target_args: [recipients, cc, bcc]
    content_args: [subject, body, attachments]
  delete_email:
    capability: delete
    sensitivity: 0.6
    reversible: false
    target_args: [email_id]
  get_unread_emails:       {output_trust: untrusted, private_output: true}
  get_sent_emails:         {output_trust: untrusted, private_output: true}
  get_received_emails:     {output_trust: untrusted, private_output: true}
  get_draft_emails:        {output_trust: untrusted, private_output: true}
  search_emails:           {output_trust: untrusted, private_output: true}
  search_contacts_by_name: {output_trust: trusted, private_output: true}
  search_contacts_by_email: {output_trust: trusted, private_output: true}
  get_current_day:         {output_trust: trusted}
  search_calendar_events:  {output_trust: untrusted, private_output: true}
  get_day_calendar_events: {output_trust: untrusted, private_output: true}
  create_calendar_event:
    capability: calendar_write
    sensitivity: 0.5
    reversible: true
    target_args: [participants]
    content_args: [title, description, location]
    value_args: [start_time, end_time]
  cancel_calendar_event:
    capability: calendar_write
    sensitivity: 0.5
    reversible: false
    target_args: [event_id]
  reschedule_calendar_event:
    capability: calendar_write
    sensitivity: 0.4
    reversible: true
    target_args: [event_id]
    value_args: [new_start_time, new_end_time]
  add_calendar_event_participants:
    capability: calendar_write
    sensitivity: 0.6
    reversible: true
    target_args: [event_id, participants]
  append_to_file:
    capability: file_write
    sensitivity: 0.4
    reversible: true
    target_args: [file_id]
    content_args: [content]
  create_file:
    capability: file_write
    sensitivity: 0.3
    reversible: true
    target_args: []
    content_args: [filename, content]
  delete_file:
    capability: delete
    sensitivity: 0.7
    reversible: false
    target_args: [file_id]
  share_file:
    capability: communicate
    sensitivity: 0.8
    reversible: true
    target_args: [file_id, email]
    value_args: [permission]
  search_files_by_filename: {output_trust: untrusted, private_output: true}
  get_file_by_id:          {output_trust: untrusted, private_output: true}
  list_files:              {output_trust: untrusted, private_output: true}
  search_files:            {output_trust: untrusted, private_output: true}
